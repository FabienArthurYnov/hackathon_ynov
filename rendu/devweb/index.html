<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #2f6feb;
    --bubble-bot: #20242c;
    --text: #e6e6e6;
    --muted: #8a8f98;
    --border: #2a2e37;
    --success: #22c55e;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    background: var(--panel);
  }
  .title {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .title span { color: var(--muted); font-weight: 400; font-size: 13px; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.06);
  }
  .status-dot.connected { background: var(--success); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bot.pending { color: var(--muted); }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  textarea {
    flex: 1;
    resize: none;
    background: #0f1115;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 140px;
  }
  button {
    background: var(--bubble-user);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <div class="title">AI Chat <span id="model-label"></span></div>
    <div class="status">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Checking…</span>
    </div>
  </header>
  <div id="chat"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
    <button id="send" type="submit">Send</button>
  </form>

<script>
const chatEl = document.getElementById('chat');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modelLabel = document.getElementById('model-label');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
modelLabel.textContent = "(__MODEL_NAME__)";

let history = [];

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function setStatus(connected, label) {
  statusDot.classList.toggle('connected', connected);
  statusText.textContent = label;
}

async function checkConnection() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    setStatus(Boolean(data.ok), data.ok ? 'Connected' : 'Disconnected');
  } catch (err) {
    setStatus(false, 'Disconnected');
  }
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data) && data.length) {
      history = data;
      chatEl.innerHTML = '';
      data.forEach((entry) => {
        if (entry && entry.role && entry.content !== undefined) {
          addBubble(entry.role, entry.content);
        }
      });
    }
  } catch (err) {
    console.error(err);
  }
}

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = inputEl.scrollHeight + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    formEl.requestSubmit();
  }
});

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addBubble('user', text);
  history.push({ role: 'user', content: text });

  const botDiv = addBubble('bot', '...');
  botDiv.classList.add('pending');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });

    if (!res.body) throw new Error('No response body');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    botDiv.classList.remove('pending');
    botDiv.textContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      full += chunk;
      botDiv.textContent = full;
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    history.push({ role: 'assistant', content: full });
    await checkConnection();
  } catch (err) {
    botDiv.classList.remove('pending');
    botDiv.textContent = 'Error: ' + err.message;
    await checkConnection();
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
});

loadHistory();
checkConnection();
setInterval(checkConnection, 10000);
</script>
</body>
</html>
